# ==========================================
#  УЛЬТИМАТИВНЫЙ КОНФИГ TMUX ДЛЯ РАЗРАБОТКИ
# ==========================================

# 1. ПОДДЕРЖКА МЫШКИ
# Включает клики по вкладкам, выделение текста и изменение размеров панелей мышью
set -g mouse on

# 2. УДОБНОЕ РАЗДЕЛЕНИЕ ЭКРАНА (СПЛИТЫ)
# Разделяет экран по кнопкам: | (вертикально) и - (горизонтально)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 3. НУМЕРАЦИЯ ОКН
# Начинает нумерацию вкладок с 1 вместо 0 (чтобы было удобнее тянуться на клавиатуре)
set -g base-index 1
setw -g pane-base-index 1

# 4. МГНОВЕННОЕ ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (Без Ctrl+B)
# Мгновенный перелет по вкладкам: 
# Ctrl + [ (переход на вкладку назад)
# Ctrl + ] (переход на вкладку вперед)
bind-key -n C-[ previous-window
bind-key -n C-] next-window


# 5. СТИЛЬ И ЦВЕТА
# Делает нижнюю статус-панель прозрачной и аккуратной (текст белый)
set -g status-style bg=default,fg=white

# Изменяет цвет активной вкладки на зеленый, чтобы вы всегда видели, где находитесь
set-window-option -g window-status-current-style fg=green,bold

# =============================================================================
# АВТОНОМНОЕ СОХРАНЕНИЕ СЕССИЙ МЕЖДУ ПЕРЕЗАГРУЗКАМИ
# =============================================================================
# Подключаем плагин сохранения сессий из системы Linux
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Дополнительные настройки для идеального восстановления:
set -g @resurrect-strategy-nvim 'session' # Запоминать состояние редактора Neovim
set -g @resurrect-capture-pane-contents 'on' # Запоминать текст, который был на экранах

# Инициализация менеджера плагинов (эта строка должна быть строго в самом конце файла!)
run '/usr/share/tmux-plugin-manager/tpm'

